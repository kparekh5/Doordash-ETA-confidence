<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dispatch Sim — Real-Time Order/Dasher Matching</title>
<style>
  :root{
    --bg:#0B0F14;
    --grid:#141B24;
    --panel:#0F1520;
    --line:#1D2632;
    --text:#E8EDF2;
    --muted:#7C8A99;
    --teal:#4CC9C0;
    --teal-dim:#245952;
    --amber:#F2A93B;
    --amber-dim:#5C4419;
    --red:#E0645A;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg);}
  body{
    font-family: ui-monospace, "SF Mono", "JetBrains Mono", Consolas, monospace;
    color:var(--text);
    display:flex;
    flex-direction:column;
    height:100vh;
    overflow:hidden;
  }
  header{
    padding:14px 18px 10px;
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:8px;
  }
  header h1{
    font-family: ui-sans-serif, Inter, system-ui, sans-serif;
    font-size:15px;
    font-weight:600;
    letter-spacing:0.02em;
    margin:0;
    color:var(--text);
  }
  header h1 span{color:var(--muted); font-weight:400;}
  .controls{display:flex; gap:8px; align-items:center;}
  button{
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--text);
    font-family:inherit;
    font-size:12px;
    padding:6px 12px;
    border-radius:4px;
    cursor:pointer;
    letter-spacing:0.03em;
  }
  button:hover{border-color:var(--teal); color:var(--teal);}
  button.active{border-color:var(--teal); color:var(--teal); background:var(--teal-dim);}
  main{
    flex:1;
    display:flex;
    min-height:0;
  }
  #canvasWrap{
    flex:1;
    position:relative;
    min-width:0;
  }
  canvas{display:block; width:100%; height:100%;}
  aside{
    width:300px;
    border-left:1px solid var(--line);
    display:flex;
    flex-direction:column;
    background:var(--panel);
  }
  .metrics{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:1px;
    background:var(--line);
    border-bottom:1px solid var(--line);
  }
  .metric{
    background:var(--panel);
    padding:12px 14px;
  }
  .metric .val{
    font-size:20px;
    font-weight:600;
    color:var(--teal);
  }
  .metric .lbl{
    font-size:10px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:0.06em;
    margin-top:2px;
  }
  .metric.amber .val{color:var(--amber);}
  .legend{
    padding:10px 14px;
    border-bottom:1px solid var(--line);
    font-size:11px;
    color:var(--muted);
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .legend .row{display:flex; align-items:center; gap:8px;}
  .dot{width:8px; height:8px; border-radius:50%; flex-shrink:0;}
  #log{
    flex:1;
    overflow-y:auto;
    padding:10px 14px;
    font-size:11px;
    line-height:1.6;
  }
  #log::-webkit-scrollbar{width:6px;}
  #log::-webkit-scrollbar-thumb{background:var(--line); border-radius:3px;}
  .logline{color:var(--muted); margin-bottom:2px;}
  .logline b{color:var(--text); font-weight:500;}
  .logline.batch{color:var(--amber);}
  .logline.batch b{color:var(--amber);}
  .logline.deliver{color:var(--teal);}
  footer{
    border-top:1px solid var(--line);
    padding:8px 14px;
    font-size:10px;
    color:var(--muted);
    text-align:center;
    letter-spacing:0.03em;
  }
</style>
</head>
<body>

<header>
  <h1>DISPATCH SIM <span>/ real-time dasher &amp; order matching with batching</span></h1>
  <div class="controls">
    <button id="pauseBtn">Pause</button>
    <button id="resetBtn">Reset</button>
  </div>
</header>

<main>
  <div id="canvasWrap"><canvas id="c"></canvas></div>
  <aside>
    <div class="metrics">
      <div class="metric"><div class="val" id="mOrders">0</div><div class="lbl">Orders placed</div></div>
      <div class="metric"><div class="val" id="mDelivered">0</div><div class="lbl">Delivered</div></div>
      <div class="metric amber"><div class="val" id="mBatchPct">0%</div><div class="lbl">Batched</div></div>
      <div class="metric"><div class="val" id="mEta">0.0s</div><div class="lbl">Avg delivery time</div></div>
    </div>
    <div class="legend">
      <div class="row"><span class="dot" style="background:#4CC9C0"></span> Dasher — idle</div>
      <div class="row"><span class="dot" style="background:#F2A93B"></span> Dasher — en route</div>
      <div class="row"><span class="dot" style="background:#E0645A"></span> Restaurant</div>
      <div class="row"><span class="dot" style="background:#8A96A3"></span> Delivery drop point</div>
    </div>
    <div id="log"></div>
  </aside>
</main>

<footer>greedy nearest-dasher assignment · same-restaurant batching within a 6s window · 2 orders / dasher max</footer>

<script>
(function(){
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const wrap = document.getElementById('canvasWrap');
  const logEl = document.getElementById('log');
  const pauseBtn = document.getElementById('pauseBtn');
  const resetBtn = document.getElementById('resetBtn');

  const mOrders = document.getElementById('mOrders');
  const mDelivered = document.getElementById('mDelivered');
  const mBatchPct = document.getElementById('mBatchPct');
  const mEta = document.getElementById('mEta');

  let W, H, DPR;
  function resize(){
    DPR = window.devicePixelRatio || 1;
    W = wrap.clientWidth; H = wrap.clientHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    canvas.style.width = W+'px'; canvas.style.height = H+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener('resize', resize);

  const RESTAURANTS = [
    {name:'R1', xf:0.18, yf:0.25},
    {name:'R2', xf:0.75, yf:0.2},
    {name:'R3', xf:0.5, yf:0.55},
    {name:'R4', xf:0.22, yf:0.78},
    {name:'R5', xf:0.82, yf:0.72},
  ];

  const SPEED = 90; // px/sec
  const BATCH_WINDOW = 6.0; // seconds
  const MAX_BATCH = 2;

  let dashers, orders, orderSeq, t, running, deliveredCount, totalDeliveryTime, batchedOrderCount, spawnTimer;

  function rand(a,b){ return a + Math.random()*(b-a); }
  function dist(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }

  function log(msg, cls){
    const d = document.createElement('div');
    d.className = 'logline' + (cls?(' '+cls):'');
    d.innerHTML = msg;
    logEl.appendChild(d);
    logEl.scrollTop = logEl.scrollHeight;
    while(logEl.children.length > 80){ logEl.removeChild(logEl.firstChild); }
  }

  function initSim(){
    dashers = [];
    for(let i=0;i<8;i++){
      dashers.push({
        id:'D'+(i+1),
        x: rand(0.1,0.9)*W, y: rand(0.15,0.9)*H,
        status:'idle', // idle | toPickup | toDropoff
        target:null,
        orders:[], // batch of 1-2 order objects currently assigned
        speed: SPEED * rand(0.85,1.15),
      });
    }
    orders = [];
    orderSeq = 0;
    t = 0;
    deliveredCount = 0;
    totalDeliveryTime = 0;
    batchedOrderCount = 0;
    spawnTimer = 0;
    logEl.innerHTML = '';
    updateMetrics();
    log('Simulation started — 8 dashers idle across the service area.');
  }

  function restaurantPx(r){ return {x:r.xf*W, y:r.yf*H, name:r.name}; }

  function spawnOrder(){
    const r = RESTAURANTS[Math.floor(Math.random()*RESTAURANTS.length)];
    const rp = restaurantPx(r);
    const drop = {x: rand(0.08,0.92)*W, y: rand(0.08,0.92)*H};
    orderSeq++;
    const order = {
      id:'#'+orderSeq,
      restaurant:r.name,
      rp, drop,
      placedAt:t,
      assignedDasher:null,
      batched:false,
      state:'pending', // pending | assigned | delivered
    };
    orders.push(order);
    mOrders.textContent = orderSeq;
    tryAssign(order);
  }

  function tryAssign(order){
    // 1) look for a dasher already en route to pick up from the SAME restaurant,
    //    not yet arrived, within the batch window, with room in the batch.
    for(const d of dashers){
      if(d.status==='toPickup' && d.orders.length < MAX_BATCH){
        const sibling = d.orders[0];
        if(sibling.restaurant === order.restaurant && (t - sibling.placedAt) <= BATCH_WINDOW){
          d.orders.push(order);
          order.assignedDasher = d.id;
          order.batched = true;
          sibling.batched = true;
          order.state='assigned';
          batchedOrderCount += 1;
          log(`<b>${order.id}</b> batched with <b>${sibling.id}</b> onto <b>${d.id}</b> at ${order.restaurant}`, 'batch');
          updateMetrics();
          return;
        }
      }
    }
    // 2) otherwise assign nearest idle dasher
    let best=null, bestDist=Infinity;
    for(const d of dashers){
      if(d.status==='idle'){
        const dd = dist(d, order.rp);
        if(dd<bestDist){ bestDist=dd; best=d; }
      }
    }
    if(best){
      best.status='toPickup';
      best.orders=[order];
      best.target=order.rp;
      order.assignedDasher = best.id;
      order.state='assigned';
      log(`<b>${order.id}</b> (${order.restaurant}) &rarr; assigned to <b>${best.id}</b>`);
    } else {
      // no idle dasher — order waits, will retry on next spawn tick via queue scan
      order.state='pending';
    }
  }

  function retryPending(){
    for(const o of orders){
      if(o.state==='pending') tryAssign(o);
    }
  }

  function stepDasher(d, dt){
    if(d.status==='idle') return;
    const tgt = d.target;
    const dd = dist(d, tgt);
    const step = d.speed*dt;
    if(dd <= step){
      d.x = tgt.x; d.y = tgt.y;
      if(d.status==='toPickup'){
        d.status='toDropoff';
        // deliver first order's drop point first
        d.target = d.orders[0].drop;
        for(const o of d.orders) o.state='enroute-drop';
      } else if(d.status==='toDropoff'){
        // deliver whichever order matches current target
        const idx = d.orders.findIndex(o=>o.drop.x===tgt.x && o.drop.y===tgt.y);
        if(idx>=0){
          const o = d.orders[idx];
          o.state='delivered';
          const dur = t - o.placedAt;
          totalDeliveryTime += dur;
          deliveredCount += 1;
          log(`<b>${o.id}</b> delivered by <b>${d.id}</b> — ${dur.toFixed(1)}s`, 'deliver');
          d.orders.splice(idx,1);
        }
        if(d.orders.length>0){
          d.target = d.orders[0].drop;
        } else {
          d.status='idle';
          d.target=null;
        }
        updateMetrics();
      }
    } else {
      d.x += (tgt.x-d.x)/dd*step;
      d.y += (tgt.y-d.y)/dd*step;
    }
  }

  function updateMetrics(){
    mDelivered.textContent = deliveredCount;
    mBatchPct.textContent = orderSeq>0 ? Math.round((batchedOrderCount/orderSeq)*100)+'%' : '0%';
    mEta.textContent = deliveredCount>0 ? (totalDeliveryTime/deliveredCount).toFixed(1)+'s' : '0.0s';
  }

  function draw(){
    ctx.clearRect(0,0,W,H);
    // graph-paper grid
    ctx.strokeStyle = getCss('--grid');
    ctx.lineWidth = 1;
    const step=32;
    for(let x=0;x<W;x+=step){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
    for(let y=0;y<H;y+=step){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }

    // restaurants
    for(const r of RESTAURANTS){
      const p = restaurantPx(r);
      ctx.fillStyle = getCss('--red');
      ctx.beginPath(); ctx.arc(p.x,p.y,6,0,7); ctx.fill();
      ctx.fillStyle = getCss('--muted');
      ctx.font = '10px ui-monospace, monospace';
      ctx.fillText(r.name, p.x+9, p.y+3);
    }

    // pending drop points (only for un-delivered orders assigned or pending)
    for(const o of orders){
      if(o.state==='delivered') continue;
      ctx.fillStyle = getCss('--muted');
      ctx.beginPath(); ctx.arc(o.drop.x,o.drop.y,3,0,7); ctx.fill();
    }

    // dashers
    for(const d of dashers){
      const color = d.status==='idle' ? getCss('--teal') : getCss('--amber');
      ctx.fillStyle = color;
      ctx.beginPath(); ctx.arc(d.x,d.y,7,0,7); ctx.fill();
      if(d.orders.length===2){
        ctx.strokeStyle = getCss('--amber');
        ctx.lineWidth=2;
        ctx.beginPath(); ctx.arc(d.x,d.y,11,0,7); ctx.stroke();
      }
      ctx.fillStyle = getCss('--text');
      ctx.font = '9px ui-monospace, monospace';
      ctx.fillText(d.id, d.x+9, d.y-8);

      // line to target
      if(d.target){
        ctx.strokeStyle = 'rgba(242,169,59,0.25)';
        ctx.lineWidth=1;
        ctx.beginPath(); ctx.moveTo(d.x,d.y); ctx.lineTo(d.target.x,d.target.y); ctx.stroke();
      }
    }
  }

  function getCss(v){
    return getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  }

  let lastTs=null;
  function loop(ts){
    if(!running){ lastTs=ts; requestAnimationFrame(loop); return; }
    if(lastTs==null) lastTs=ts;
    const dt = Math.min((ts-lastTs)/1000, 0.1);
    lastTs=ts;
    t += dt;
    spawnTimer -= dt;
    if(spawnTimer<=0){
      spawnOrder();
      spawnTimer = rand(1.2, 2.6);
      retryPending();
    }
    for(const d of dashers) stepDasher(d,dt);
    draw();
    requestAnimationFrame(loop);
  }

  running = true;
  pauseBtn.addEventListener('click', ()=>{
    running = !running;
    pauseBtn.textContent = running ? 'Pause' : 'Resume';
    pauseBtn.classList.toggle('active', !running);
  });
  resetBtn.addEventListener('click', ()=>{ resize(); initSim(); });

  resize();
  initSim();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
